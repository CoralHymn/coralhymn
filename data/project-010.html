        <article class="project-content">
            <h2>项目概述</h2>
            <p>WP-helrer 是一个在 wplace.live 地图上快速截图的浏览器扩展。它从 wplace.eralyon.net 获取历史版本数据，支持实时画面截图与任意历史日期回溯，并把截图功能从 Python 监控机器人重写为轻量的 JS 扩展。</p>

            <h2>核心功能</h2>
            <ul>
                <li>实时地图区域截图</li>
                <li>历史日期版本截图</li>
                <li>复用 WP 终结者的坐标定位脚本</li>
                <li>浏览器扩展一键安装，无需后端</li>
            </ul>
