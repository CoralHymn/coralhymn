            <p>Pacific-Abyss 是《铁锈战争》的深海大洋主题模组，于 2025 年 7 月正式开源。模组包含海军、空军、装甲部队、建筑单位与原创地图，并持续补充单位模型和战场内容。</p>

            <h2>内容与特色</h2>
            <ul>
                <li>美军、英军、日军等阵营的海陆空单位</li>
                <li>原创地图与建筑单位扩展</li>
                <li>PC 与 Android 双平台安装包</li>
                <li>MIT 开源，代码与图像允许商用但需注明来源</li>
